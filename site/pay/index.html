<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Оплата — Фигурное катание</title>
<meta name="theme-color" content="#0A2342">
<link rel="icon" href="../app/icon-64.png">
<!-- Сюда сервис оплаты возвращает человека после страницы оплаты (BILLING_RETURN_URL).
     В приложении встроенный браузер закрывается на этом адресе сам, страницу видно только
     с компьютера, где оплата идёт в обычном браузере. Прошла ли оплата, страница не знает:
     это говорит приложение, сверившись с сервером. -->
<style>
  :root { --bg: #F3F6F9; --ink: #0D1925; --ink2: #55667A; --accent: #1C5C9C; }
  @media (prefers-color-scheme: dark) { :root { --bg: #09131D; --ink: #E9F0F6; --ink2: #9DAEBC; --accent: #72B4F2; } }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  main { max-width: 460px; margin: 0 auto; padding: calc(env(safe-area-inset-top) + 64px) 20px 40px; text-align: center; }
  img { width: 76px; height: 76px; border-radius: 18px; }
  h1 { margin: 22px 0 8px; font-size: 26px; line-height: 1.15; letter-spacing: -.4px; }
  p { margin: 0 auto; max-width: 340px; color: var(--ink2); }
</style>
</head>
<body>
<main>
  <img src="../app/icon-180.png" alt="">
  <h1>Можно вернуться в приложение</h1>
  <p>Страница оплаты закрыта. Прошла ли оплата, приложение покажет в Настройках, в разделе «Подписка».</p>
</main>
</body>
</html>
