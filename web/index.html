<!DOCTYPE html>
<html lang="ru">
<head>
  <base href="/Starty/web/">
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Фигурное катание</title>
  <meta name="description" content="Календарь стартов по фигурному катанию: российские и международные турниры, протоколы, эфиры">

  <!-- значок на экране «Домой» и в браузере -->
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-title" content="Фигурное катание">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="theme-color" content="#F1F6FB" media="(prefers-color-scheme: light)">
  <meta name="theme-color" content="#06101B" media="(prefers-color-scheme: dark)">
  <meta name="format-detection" content="telephone=no">
  <link rel="apple-touch-icon" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icons/Icon-192.png">
  <link rel="icon" type="image/png" sizes="16x16" href="favicon.png">
  <link rel="manifest" href="manifest.json">

  <style>
    :root { --bg: #F1F6FB; --ink: #0B1A2A; --ink2: #4A6077; --track: #DCE7F2; --run: #1D63AD; color-scheme: light; }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) { --bg: #06101B; --ink: #E8F1FA; --ink2: #9CB1C6; --track: #15283C; --run: #80BBF2; color-scheme: dark; }
    }
    :root[data-theme="dark"] { --bg: #06101B; --ink: #E8F1FA; --ink2: #9CB1C6; --track: #15283C; --run: #80BBF2; color-scheme: dark; }
    html, body { margin: 0; height: 100%; background: var(--bg); }
    #splash {
      position: fixed; inset: 0; z-index: 10; display: flex; flex-direction: column; align-items: center; justify-content: center;
      gap: 18px; background: var(--bg); color: var(--ink);
      font: 600 17px/1.3 -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      transition: opacity .28s ease;
    }
    #splash.gone { opacity: 0; pointer-events: none; }
    #splash img { width: 88px; height: 88px; border-radius: 22px; box-shadow: 0 10px 30px rgba(10, 35, 66, .22); }
    #splash .name { letter-spacing: -.01em; }
    #splash .bar { width: 112px; height: 3px; border-radius: 3px; background: var(--track); overflow: hidden; }
    #splash .bar i { display: block; width: 40%; height: 100%; border-radius: 3px; background: var(--run); animation: run 1.1s ease-in-out infinite; }
    #splash .slow { min-height: 1.3em; font-weight: 500; font-size: 14px; color: var(--ink2); text-align: center; padding: 0 24px; }
    @keyframes run { from { transform: translateX(-100%); } to { transform: translateX(280%); } }
    @media (prefers-reduced-motion: reduce) { #splash .bar i { animation: none; width: 100%; opacity: .5; } }
  </style>
  <script>
    // тема из настроек приложения (shared_preferences хранит её в localStorage), иначе — как в системе
    try {
      var t = JSON.parse(localStorage.getItem('flutter.theme') || 'null');
      if (t === 'light' || t === 'dark') document.documentElement.setAttribute('data-theme', t);
    } catch (e) {}
  </script>
</head>
<body>
  <div id="splash" role="status" aria-live="polite">
    <img src="icons/Icon-192.png" alt="">
    <div class="name">Фигурное катание</div>
    <div class="bar" aria-hidden="true"><i></i></div>
    <div class="slow"></div>
  </div>
  <noscript><p style="font-family:sans-serif;text-align:center;padding:40px 24px">Включите JavaScript — без него веб-версия не работает.</p></noscript>
  <script>
    (function () {
      var s = document.getElementById('splash');
      var slow = setTimeout(function () { s.querySelector('.slow').textContent = 'Загрузка идёт дольше обычного'; }, 15000);
      window.addEventListener('flutter-first-frame', function () {
        clearTimeout(slow);
        s.classList.add('gone');
        setTimeout(function () { s.remove(); }, 400);
      }, { once: true });
    })();
  </script>
  <script src="flutter_bootstrap.js" async></script>
</body>
</html>
