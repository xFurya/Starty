name: SQL Supabase

# Выполняет SQL подписки в проекте Supabase приложения. Нужен секрет репозитория SUPABASE_ACCESS_TOKEN
# (Supabase → аватар → Account preferences → Access Tokens → Generate new token). Журнал публичный:
# печатаются только имена файлов и коды ответа (tools/billing/apply_sql.py).
#   schema    — таблицы и функции подписки, коды (tools/billing/schema.sql, повторяемый)
#   sync      — аккаунты и синхронизация (tools/sync/schema.sql, повторяемый); нужен до schema
#   dev-token — токен разработчика (в базу идёт только хэш; сам код знает владелец)
on:
  workflow_dispatch:
    inputs:
      step:
        description: 'schema | sync | dev-token'
        default: schema
        type: choice
        options: [schema, sync, dev-token]

permissions:
  contents: read

concurrency:
  group: supabase-sql
  cancel-in-progress: false

jobs:
  sql:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
      - name: Исходники
        uses: ./.github/actions/core
        with:
          token: ${{ secrets.SRC_PAT }}

      - name: Выполнить
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          STEP: ${{ github.event.inputs.step }}
        run: |
          set -euo pipefail
          if [ -z "$SUPABASE_ACCESS_TOKEN" ]; then
            echo "::error::Нет секрета SUPABASE_ACCESS_TOKEN (как добавить: в начале этого файла)"
            exit 1
          fi
          case "$STEP" in
            schema)
              python3 tools/billing/apply_sql.py tools/billing/schema.sql
              python3 tools/billing/apply_sql.py --ask "select to_regprocedure('public.redeem_code(text)') is not null" ;;
            sync)
              python3 tools/billing/apply_sql.py tools/sync/schema.sql
              python3 tools/billing/apply_sql.py --ask "select to_regprocedure('public.save_settings(jsonb)') is not null or exists (select 1 from information_schema.tables where table_schema = 'public' and table_name = 'user_settings')" ;;
            dev-token)
              python3 tools/billing/apply_sql.py tools/billing/seed_dev_token.sql
              python3 tools/billing/apply_sql.py --ask "select exists (select 1 from public.billing_codes where kind = 'dev' and uses_left > 0)" ;;
            *) echo "::error::неизвестный шаг"; exit 1 ;;
          esac
