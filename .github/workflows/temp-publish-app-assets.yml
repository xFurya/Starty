name: TEMP Publish current app assets to Pages

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/temp-publish-app-assets.yml'

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Publish the current app assets to gh-pages
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin gh-pages
          git worktree add -B publish-app-pages /tmp/publish-app-pages origin/gh-pages
          mkdir -p /tmp/publish-app-pages/app
          cp -a site/app/. /tmp/publish-app-pages/app/
          cd /tmp/publish-app-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add app
          if git diff --cached --quiet; then
            echo "App assets already current"
          else
            git commit -m "Publish Starty Android 1.0.14 app assets"
            git push origin HEAD:gh-pages
          fi
