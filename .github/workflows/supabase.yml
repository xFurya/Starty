name: Функции Supabase

# Выкладывает функции сервера (tools/billing/supabase/functions) в проект Supabase приложения
# klhzfgjzgdmsggbxcinj. Нужен секрет репозитория SUPABASE_ACCESS_TOKEN (Supabase → аватар →
# Account preferences → Access Tokens → Generate new token). Без секрета — пропуск с понятной строкой.
#
# Сама по пушу выкладывает только board — табло турниров для веб-версии: ей не нужны ни ключи, ни
# база. Функции подписки — только руками (Run workflow → «all»), когда для них готовы секреты
# (ПОДПИСКА.md, «Как включить»).
on:
  workflow_dispatch:
    inputs:
      which:
        description: 'board — только табло; all — все функции, включая подписку'
        default: board
        type: choice
        options: [board, all]
  push:
    branches: [main]
    paths: ['tools/billing/supabase/functions/board/**', 'tools/billing/supabase/functions/_shared/board.ts', 'tools/billing/supabase/config.toml', '.github/workflows/supabase.yml']

permissions:
  contents: read

concurrency:
  group: supabase-functions
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - name: Есть ли ключ
        id: key
        env:
          T: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          if [ -z "$T" ]; then
            echo "::warning::Нет секрета SUPABASE_ACCESS_TOKEN — функции не выложены (как добавить — в начале этого файла)"
            echo "ok=false" >> "$GITHUB_OUTPUT"
          else
            echo "ok=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: supabase/setup-cli@v1
        if: steps.key.outputs.ok == 'true'
        with:
          version: latest

      - name: Выложить
        if: steps.key.outputs.ok == 'true'
        working-directory: tools/billing
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          WHICH: ${{ github.event.inputs.which || 'board' }}
        run: |
          set -euo pipefail
          if [ "$WHICH" = "all" ]; then
            supabase functions deploy --project-ref klhzfgjzgdmsggbxcinj --use-api
          else
            supabase functions deploy board --project-ref klhzfgjzgdmsggbxcinj --use-api
          fi

      - name: Проверка табло
        if: steps.key.outputs.ok == 'true'
        run: |
          # функция отвечает заголовком x-board — по нему же приложение понимает, что она выложена
          for i in 1 2 3 4 5 6; do
            if curl -sS -D - -o /dev/null "https://klhzfgjzgdmsggbxcinj.supabase.co/functions/v1/board?u=https%3A%2F%2Fresults.isu.org%2Fresults%2Fseason2526%2Fowg2026%2Findex.htm" | grep -qi '^x-board: 1'; then
              echo "board отвечает"; exit 0
            fi
            sleep 10
          done
          echo "::warning::board выложена, но пока не отвечает — проверить в Supabase → Edge Functions → board → Logs"
