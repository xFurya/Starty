name: Проверки приложения и скрапера

on:
  push:
    branches: [fix/sheet-motion-and-country-codes]
    paths:
      - 'app/**'
      - 'scraper/**'
      - 'ПРОЕКТ.md'
      - '.github/workflows/validate.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  flutter:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@v5
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true
      - name: Проверить анализатором
        working-directory: app
        run: |
          flutter pub get
          flutter analyze
      - name: Тесты Flutter
        working-directory: app
        run: flutter test
      - name: Проверить синтаксис скрапера
        run: python3 -m compileall -q scraper
