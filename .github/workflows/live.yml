name: Итоги во время стартов

# Каждые 10 минут: если сейчас идёт сегмент (или прошёл, а итог ещё не окончательный),
# обновить только его — промежуточные итоги, тройку, места наших, итог турнира и
# примечательное. Нечего обновлять — выход за секунды, без публикации.
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  live:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Есть ли что обновлять
        id: check
        run: |
          if python3 -m scraper.live --check; then echo "go=true" >> "$GITHUB_OUTPUT"; else echo "go=false" >> "$GITHUB_OUTPUT"; fi

      - name: Установить pdftotext
        if: steps.check.outputs.go == 'true'
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Прежние протоколы с gh-pages
        # протоколы в main не хранятся (.gitignore): сайт пересоздаётся из site/, поэтому
        # прошлые файлы турниров берём с gh-pages, иначе публикация их сотрёт
        if: steps.check.outputs.go == 'true'
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/protocols-from-pages.sh

      - name: Обновить итоги
        if: steps.check.outputs.go == 'true'
        id: run
        run: |
          export STARTY_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          # протоколы сравниваем без status.json: он меняется каждый прогон и один публикацию не вызывает
          sum() { find site/data/protocols -name '*.json' ! -name status.json -exec sha1sum {} + | sort | sha1sum; }
          before=$(sum)
          python3 -m scraper.live
          git add -A site data
          if git diff --cached --quiet && [ "$(sum)" = "$before" ]; then echo "changed=false" >> "$GITHUB_OUTPUT"; else echo "changed=true" >> "$GITHUB_OUTPUT"; fi

      - name: Сохранить данные
        if: steps.run.outputs.changed == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # изменились только протоколы — в main коммитить нечего, сайт публикуется ниже
          git diff --cached --quiet && exit 0
          git commit -q -m "Итоги на $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
          for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done

      - name: Опубликовать сайт (gh-pages)
        if: steps.run.outputs.changed == 'true'
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
