name: Сборка iOS

# .ipa без подписи: на iPhone её ставит и подписывает SideStore вашим Apple ID.
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['app/**', '.github/workflows/app-ios.yml']

permissions:
  contents: write
  actions: write

concurrency:
  group: app-ios
  cancel-in-progress: true

jobs:
  ios:
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5

      # номер выдаётся один раз: уже выложенный номер не пересобирается
      - name: Проверить номер
        id: num
        run: |
          BUILD=$(grep '^version:' app/pubspec.yaml | sed 's/.*+//')
          HAVE=$(python3 -c "import json; print(json.load(open('site/app/sidestore.json'))['apps'][0]['versions'][0]['buildVersion'])")
          if [ "$BUILD" = "$HAVE" ]; then echo "сборка $BUILD уже выложена"; echo "new=false" >> "$GITHUB_OUTPUT"; else echo "new=true" >> "$GITHUB_OUTPUT"; fi

      - uses: subosito/flutter-action@v2
        if: steps.num.outputs.new == 'true'
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Собрать
        if: steps.num.outputs.new == 'true'
        working-directory: app
        run: |
          BUILD=$(grep '^version:' pubspec.yaml | sed 's/.*+//')
          VER=$(grep '^version:' pubspec.yaml | sed 's/version: *//; s/+.*//')
          flutter pub get
          flutter build ios --release --no-codesign --dart-define=BUILD=$BUILD --dart-define=VERSION=$VER
          cd build/ios/iphoneos
          rm -rf Payload && mkdir Payload && cp -R Runner.app Payload/
          zip -qry Starty.ipa Payload
          ls -la Starty.ipa

      - name: Выложить на сайт
        if: steps.num.outputs.new == 'true'
        run: |
          cp app/build/ios/iphoneos/Starty.ipa site/app/Starty.ipa
          # SideStore видит новую версию только вместе с готовой сборкой
          python3 - <<'PY'
          import datetime, json, os, re
          ver, build = re.search(r"^version:\s*(\S+)\+(\d+)", open("app/pubspec.yaml").read(), re.M).groups()
          p = "site/app/sidestore.json"
          j = json.load(open(p))
          v = j["apps"][0]["versions"][0]
          v.update(version=ver, buildVersion=build, date=datetime.date.today().isoformat(),
                   size=os.path.getsize("site/app/Starty.ipa"))
          json.dump(j, open(p, "w"), ensure_ascii=False, indent=1)
          v = json.load(open("site/app/version.json"))
          v["ios"].update(version=ver, build=int(build), note="")
          json.dump(v, open("site/app/version.json", "w"), ensure_ascii=False, indent=1)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add site/app/Starty.ipa site/app/sidestore.json site/app/version.json
          git commit -q -m "iOS: сборка $(grep '^version:' app/pubspec.yaml | sed 's/version: //')" || exit 0
          for i in 1 2 3; do git pull -q --rebase && git push -q && break; sleep 5; done
          # опубликовать сайт сразу, не дожидаясь расписания
          gh workflow run update.yml --ref main
        env:
          GH_TOKEN: ${{ github.token }}
