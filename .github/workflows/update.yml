name: Обновление расписания

on:
  schedule:
    - cron: '0 6 * * *'    # 09:00 МСК
    - cron: '0 12 * * *'   # 15:00 МСК
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
      - 'site/calendar.ics'
      - 'site/e/**'
      - 'data/**'

permissions:
  contents: write
  actions: write   # разбудить live.yml, если идут старты

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main

      - name: Установить pdftotext, Pillow и OpenCV
        # OpenCV — найти лицо на фото спортсмена и обрезать по нему (scraper/photos.py)
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils python3-pil
          python3 -m pip install -q --break-system-packages opencv-python-headless

      - name: Прежние протоколы с gh-pages
        # протоколы в main не хранятся: без них сборщик не знает последних удачных файлов
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/protocols-from-pages.sh

      - name: Собрать расписание
        run: |
          export STARTY_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python3 -m scraper.build

      - name: Блокировка публикации
        # живой сбор (live.yml) работает параллельно и тоже публикует gh-pages; под замком — только
        # короткий хвост: сохранить данные, слить свежие протоколы, опубликовать
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/pages-lock.sh acquire

      - name: Сохранить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -q -m "Расписание на $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
            # пока шёл сбор, в main могли прийти другие коммиты: свои данные важнее
            for i in 1 2 3; do git pull -q --rebase -X theirs origin main && git push -q && break; sleep 5; done
          fi

      - name: Свежие протоколы живого сбора
        # пока шёл сбор, live.yml мог записать на gh-pages протоколы новее наших: берём более свежие
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: |
          DEST=$RUNNER_TEMP/fresh bash tools/protocols-from-pages.sh
          python3 -m scraper.pages_merge "$RUNNER_TEMP/fresh" site/data/protocols

      - name: Опубликовать сайт (gh-pages)
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/publish-pages.sh

      - name: Снять блокировку
        if: always()
        env:
          REPO_URL: https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git
        run: bash tools/pages-lock.sh release

      - name: Разбудить живой сбор
        # cron у GitHub не точен: если идут или скоро начнутся старты, а live.yml не работает, запускаем его
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          plan=$(python3 -m scraper.live --plan || echo none)
          echo "план живого сбора: $plan"
          if [ "$plan" != none ]; then
            busy=$(gh run list --workflow live.yml --json status --jq '[.[] | select(.status=="in_progress" or .status=="queued")] | length')
            if [ "${busy:-0}" = 0 ]; then gh workflow run live.yml --ref main; fi
          fi
