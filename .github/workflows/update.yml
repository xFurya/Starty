name: Обновление расписания

on:
  schedule:
    - cron: '0 6 * * *'    # 09:00 МСК
    - cron: '0 12 * * *'   # 15:00 МСК
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - 'site/data/**'
      - 'site/calendar.ics'
      - 'site/e/**'
      - 'data/**'

permissions:
  contents: write

concurrency:
  group: update
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v5

      - name: Установить pdftotext
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils

      - name: Собрать расписание
        run: |
          export STARTY_URL="https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
          python3 -m scraper.build

      - name: Сохранить данные
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A site data
          if git diff --cached --quiet; then
            echo "Данные не изменились"
          else
            git commit -q -m "Расписание на $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
            git push
          fi

      - name: Опубликовать сайт (gh-pages)
        run: |
          cd site
          touch .nojekyll
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -q -m "Сайт: $(TZ=Europe/Moscow date '+%d.%m.%Y %H:%M') МСК"
          git push -f -q "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" gh-pages
          echo "Опубликовано: https://${GITHUB_REPOSITORY_OWNER,,}.github.io/${GITHUB_REPOSITORY#*/}/"
