name: Исходники
description: Подтягивает исходники и накладывает их на рабочую папку.
inputs:
  token:
    description: Токен с правом чтения
    required: true
  repository:
    description: Репозиторий с исходниками
    default: xFurya/starty-core
  ref:
    description: Ветка или коммит
    default: main
runs:
  using: composite
  steps:
    - uses: actions/checkout@v5
      with:
        repository: ${{ inputs.repository }}
        ref: ${{ inputs.ref }}
        token: ${{ inputs.token }}
        path: .core
        persist-credentials: false
    - shell: bash
      env:
        PYTHONUTF8: '1'
      run: |
        py=
        for c in python3 python py; do
          if "$c" -c "" >/dev/null 2>&1; then py=$c; break; fi
        done
        [ -n "$py" ] || { echo "::error::no python for the source overlay"; exit 1; }
        "$py" .github/actions/core/overlay.py .core .
        rm -rf .core
